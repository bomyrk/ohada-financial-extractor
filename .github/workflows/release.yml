name: Auto Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.10"

      - name: Determine next version
        id: version
        run: |
          # Extract last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.2")
          
          echo "Last tag detected: $LAST_TAG"
            
          # Compute next version based on type
          BASE=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          
          case "${{ github.event.inputs.version_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch|*)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"
            
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.next_version }}"/' pyproject.toml
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.next_version }}"
          git push origin main

      - name: Create tag
        run: |
          git tag -a "v${{ steps.version.outputs.next_version }}" -m "Release v${{ steps.version.outputs.next_version }}"
          git push origin "v${{ steps.version.outputs.next_version }}"

      - name: Re-checkout to include the new tag
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: "refs/tags/v${{ steps.version.outputs.next_version }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean dist folder
        run: rm -rf dist/*

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: List dist folder
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.10.0
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}