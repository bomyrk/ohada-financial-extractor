[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohada-financial-extractor"
version = "0.1.5"
description = "Extract and normalize financial data from OHADA-compliant Excel financial statements (DSF)"
readme = { file = "docs/README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
    {name = "Kamguia Wabo, Leonel B.", email = "bomyr.kamguia@bkresearchandanalytics.com"},
    {name = "Ndayou, Ronald V.", email = "ronald.ndayou@bkresearchandanalytics.com"},
]

keywords = ["OHADA", "financial-extraction", "accounting", "Excel", "data-extraction", "financial statements"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "openpyxl>=3.1.5",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "xarray>=0.21.0",
    "pyqt5>=5.15.11",
    "matplotlib>=3.10.1",
    "plotly>=6.5.0",
    "streamlit>=1.56.0"
]

[project.optional-dependencies]
dev = ["pytest>=6.0", "pytest-cov>=2.12.0"]

[project.urls]
Homepage = "https://github.com/bomyrk/ohada-financial-extractor"
Repository = "https://github.com/bomyrk/ohada-financial-extractor.git"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ohada_extractor", "ohada_extractor.*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
]

ignore = ["E711", "B905", "E501"]
